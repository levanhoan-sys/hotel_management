server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hotel-management-system
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_management}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  security:
    access-token-secret: ${ACCESS_TOKEN_SECRET:local-development-only-token-secret-change-before-deploy-2026}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  bootstrap:
    admin:
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    receptionist:
      username: ${APP_BOOTSTRAP_RECEPTIONIST_USERNAME:}
      password: ${APP_BOOTSTRAP_RECEPTIONIST_PASSWORD:}

hotel:
  payment:
    bank:
      bin: ${HOTEL_BANK_BIN:}
      account-number: ${HOTEL_BANK_ACCOUNT:}
      account-name: ${HOTEL_BANK_ACCOUNT_NAME:}
  booking:
    deposit-rate: 0.30
    deposit-timeout-minutes: 15
    check-in-time: "14:00"
    timezone: Asia/Ho_Chi_Minh
    cancellation-free-hours: 72
    cancellation-partial-hours: 24
